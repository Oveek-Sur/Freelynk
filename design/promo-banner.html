<!doctype html>
<meta charset="utf-8" />
<!--
  The in-app banner that explains FreeLynk and invites advertisers.

  Sized 1200x500 to match the carousel's 12:5 frame, so nothing important
  is cropped. Text is kept large and to the left because the carousel
  renders about 350px wide on a phone — anything smaller than roughly
  28px here becomes unreadable there.
-->
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px; height: 500px;
    font-family: 'Nirmala UI', 'Shonar Bangla', 'Segoe UI', sans-serif;
    color: #E2F2FF;
    background:
      radial-gradient(circle at 82% 28%, rgba(34,211,238,0.20) 0%, transparent 52%),
      linear-gradient(120deg, #00131F 0%, #012A45 58%, #001B2E 100%);
    display: flex; align-items: center;
    overflow: hidden;
  }
  .left { padding: 0 0 0 62px; flex: 1; }
  .brandline { display: flex; align-items: center; gap: 18px; }
  .mark { width: 74px; height: 74px; }
  .name {
    font-size: 60px; font-weight: 800; letter-spacing: -1.5px;
    background: linear-gradient(100deg, #7DD3FC, #22D3EE 55%, #34D399);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag { margin-top: 14px; font-size: 33px; font-weight: 600; color: #BAE6FD; }
  .sub { margin-top: 8px; font-size: 25px; color: #7FB4D6; }

  .cta {
    margin-top: 28px; display: inline-block;
    border: 1.5px solid rgba(52,211,153,0.42);
    background: rgba(52,211,153,0.10);
    border-radius: 16px; padding: 14px 24px;
  }
  .cta .label { font-size: 21px; color: #9FD9C4; }
  .cta .mail {
    margin-top: 4px; font-size: 30px; font-weight: 700; color: #6EE7B7;
    font-family: 'Segoe UI', sans-serif; letter-spacing: -0.3px;
  }

  .right { width: 400px; display: grid; place-items: center; }
  .glow { width: 300px; height: 300px; opacity: 0.5; }
</style>

<div class="left">
  <div class="brandline">
    <svg class="mark" viewBox="0 0 200 200">
      <defs>
        <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7DD3FC" /><stop offset="100%" stop-color="#22D3EE" />
        </linearGradient>
      </defs>
      <g fill="none" stroke="url(#b)" stroke-linecap="round">
        <path stroke-width="15" d="M 26 96 A 104 104 0 0 1 174 96" />
        <path stroke-width="16" d="M 51 121 A 69 69 0 0 1 149 121" />
        <path stroke-width="17" d="M 76 146 A 34 34 0 0 1 124 146" />
      </g>
      <circle cx="100" cy="168" r="13" fill="#34D399" />
    </svg>
    <div class="name">FreeLynk</div>
  </div>

  <div class="tag">আশেপাশের ফ্রি ওয়াইফাই — এক ট্যাপে</div>
  <div class="sub">পাসওয়ার্ড মনে রাখার দরকার নেই, ইন্টারনেট ছাড়াও চলে</div>

  <div class="cta">
    <div class="label">বিজ্ঞাপন দিতে চান? মেইল করুন</div>
    <div class="mail">falconsecintelligence@gmail.com</div>
  </div>
</div>

<div class="right">
  <svg class="glow" viewBox="0 0 200 200">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#38BDF8" /><stop offset="100%" stop-color="#0EA5E9" />
      </linearGradient>
    </defs>
    <g fill="none" stroke="url(#g)" stroke-linecap="round" opacity="0.75">
      <path stroke-width="12" d="M 26 96 A 104 104 0 0 1 174 96" />
      <path stroke-width="13" d="M 51 121 A 69 69 0 0 1 149 121" />
      <path stroke-width="14" d="M 76 146 A 34 34 0 0 1 124 146" />
    </g>
    <circle cx="100" cy="168" r="11" fill="#34D399" opacity="0.8" />
  </svg>
</div>
