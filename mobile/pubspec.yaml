name: sharelynk
description: "ShareLynk — offline-first WiFi access. No login, no payments."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # state
  flutter_riverpod: ^2.5.1

  # networking + crypto
  http: ^1.2.1
  cryptography: ^2.7.0

  # wifi
  wifi_iot: ^0.3.19
  wifi_scan: ^0.4.1+2
  permission_handler: ^11.3.1
  app_settings: ^5.1.1

  # storage
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
