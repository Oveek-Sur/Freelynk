name: freelynk
description: "FreeLynk — offline-first WiFi access. No login, no payments."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # state
  flutter_riverpod: ^2.5.1

  # networking + crypto
  http: ^1.2.1
  cryptography: ^2.7.0

  # Image.network holds decoded frames in memory only, so every cold start
  # re-downloaded every banner and shop photo. Across a large install base
  # that is the biggest bill the project could run up, for pictures that
  # change once a month. This keeps them on disk between launches.
  cached_network_image: ^3.4.1

  # wifi
  wifi_iot: ^0.3.19
  wifi_scan: ^0.4.1+2
  permission_handler: ^11.3.1
  app_settings: ^5.1.1

  # storage
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # opening banner links and dialling partner shops
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

  # faking the storage directory so the offline cache can be tested
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
