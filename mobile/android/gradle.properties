android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Keep this build gentle on the machine -------------------------------
# 2G is plenty for an app this small. The original 8G heap + 4G metaspace was
# reserving more RAM than the whole build ever needed.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m

# No parallel module execution and at most 2 worker processes, so a build
# never saturates every core and freezes the desktop.
org.gradle.parallel=false
org.gradle.workers.max=2

# Run the Kotlin compiler inside the Gradle daemon instead of spawning a
# second long-lived JVM.
kotlin.compiler.execution.strategy=in-process

# Reuse outputs between builds — less work, not more.
org.gradle.caching=true

# The pub cache lives on C:\ while this project sits on D:\. Kotlin's
# incremental compiler stores paths relative to the module root and fails with
# "this and base files have different roots" when a plugin's Kotlin source is
# on another drive. It recovers, but it poisons the cache and makes builds
# fail at random, so incremental Kotlin is off here.
kotlin.incremental=false
